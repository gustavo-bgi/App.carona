<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Caronas</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Estilos extras para o Modo Admin */
        .admin-only { display: none !important; }
        .modo-admin-ativo .admin-only { display: inline-block !important; }
        .modo-admin-ativo .section-header h2::after { content: ' (Admin)'; font-size: 0.8rem; color: red; }
        
        /* Botão de Admin no Header */
        .btn-admin-toggle { background: none; border: none; font-size: 1.2rem; cursor: pointer; opacity: 0.5; }
        .modo-admin-ativo .btn-admin-toggle { opacity: 1; transform: scale(1.1); }
    </style>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay hidden"><div class="spinner"></div></div>

    <header class="header">
        <div class="container">
            <div style="display: flex; align-items: center; gap: 10px;">
                <h1>🚗 Caronas</h1>
                <button id="btnToggleAdmin" class="btn-admin-toggle" title="Modo Administrador">🔒</button>
            </div>
            
            <div class="header-actions">
                <select id="mesSelecionado" class="month-selector"></select>
                
                <button id="btnAdminPanel" class="btn btn-danger btn-sm admin-only">⚙️ Admin</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="dashboard">
            <h2>Resumo - <span id="labelMesAtual">---</span></h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">🗓️</div>
                    <div>
                        <div class="stat-label">Viagens</div>
                        <div class="stat-value" id="totalViagens">0</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💰</div>
                    <div>
                        <div class="stat-label">Movimentado</div>
                        <div class="stat-value" id="custoTotal">R$ 0,00</div>
                    </div>
                </div>
                <div class="stat-card admin-only" style="cursor: pointer; background: #fff1f2; border: 1px solid #fda4af;" id="cardFecharMes">
                    <div class="stat-icon">🏁</div>
                    <div>
                        <div class="stat-label">Ação Admin</div>
                        <div class="stat-value" style="font-size: 1rem; color: #e11d48;">Fechar Mês &rarr;</div>
                    </div>
                </div>
            </div>
        </section>

        <hr class="divider">

        <section class="section-pessoas">
            <div class="section-header">
                <h2>Saldos</h2>
                <button onclick="abrirModalPessoa()" class="btn btn-primary btn-sm admin-only">+ Pessoa</button>
            </div>
            <div class="table-responsive">
                <table class="table" id="tabelaPessoas">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th class="text-right">A Pagar</th>
                            <th class="text-right">A Receber</th>
                            <th class="text-right">Líquido</th>
                            <th class="admin-only">Admin</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <hr class="divider">

        <section class="section-viagens">
            <div class="section-header">
                <h2>Viagens</h2>
                <button id="btnNovaViagem" class="btn btn-primary btn-sm">+ Nova Viagem</button>
            </div>
            <div class="table-responsive">
                <table class="table" id="tabelaViagens">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Motorista</th>
                            <th>Passageiros</th>
                            <th>Valor</th>
                            <th>Total</th>
                            <th class="admin-only">Ações</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="modalAdmin" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header"><h3>Painel Administrativo</h3><button class="modal-close" data-modal="modalAdmin">&times;</button></div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Valor Padrão da Carona (R$)</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="configValorPadrao" class="form-control">
                        <button id="btnSalvarConfigValor" class="btn btn-primary">Salvar</button>
                    </div>
                </div>
                <hr class="divider">
                <h4>Gerenciar Usuários</h4>
                <div id="listaUsuariosAdmin" style="max-height: 200px; overflow-y: auto; margin-top: 10px;">
                    </div>
            </div>
        </div>
    </div>

    <div id="modalViagem" class="modal hidden">
        <div class="modal-content modal-lg">
            <div class="modal-header"><h3>Nova Viagem</h3><button class="modal-close" data-modal="modalViagem">&times;</button></div>
            <div class="modal-body">
                <input type="hidden" id="viagemId">
                <div class="row">
                    <div class="col"><label>Data</label><input type="date" id="viagemData" class="form-control"></div>
                    <div class="col"><label>Motorista</label><select id="viagemMotorista" class="form-control"></select></div>
                </div>
                <div class="form-group" style="margin-top: 10px;">
                    <label>Valor Individual (R$)</label>
                    <input type="number" id="viagemValorPorPessoa" class="form-control" step="0.50">
                </div>
                <div class="form-group">
                    <label>Passageiros</label>
                    <div id="listaPassageirosCheckboxes" class="checkbox-list"></div>
                </div>
                <div class="form-group"><label>Obs</label><input type="text" id="viagemObservacao" class="form-control"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-modal="modalViagem">Cancelar</button>
                <button id="btnSalvarViagem" class="btn btn-primary">Confirmar</button>
            </div>
        </div>
    </div>

    <div id="modalPessoa" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header"><h3>Dados da Pessoa</h3><button class="modal-close" data-modal="modalPessoa">&times;</button></div>
            <div class="modal-body">
                <input type="hidden" id="pessoaId">
                <div class="form-group"><label>Nome</label><input type="text" id="pessoaNome" class="form-control"></div>
                <div class="checkbox-group"><input type="checkbox" id="pessoaAtivo" checked><label>Usuário Ativo</label></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-modal="modalPessoa">Cancelar</button>
                <button id="btnSalvarPessoa" class="btn btn-primary">Salvar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/utils.js"></script>
    <script src="js/db-config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
