<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caronas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay hidden"><div class="spinner"></div></div>

    <header class="header">
        <div class="container">
            <div style="display:flex; align-items:center; gap:8px;">
                <h1>🚗 Caronas</h1>
                <button id="btnToggleAdmin" style="background:none; border:none; font-size:1.2rem; cursor:pointer; opacity:0.3;">🔒</button>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
                <select id="mesSelecionado" class="month-selector"></select>
                <button id="btnAdminPanel" class="btn btn-danger btn-sm admin-only">⚙️</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="dashboard">
            <div class="stat-card">
                <div class="stat-icon">🗓️</div>
                <div>
                    <div class="stat-label">Viagens em <span id="labelMes">...</span></div>
                    <div class="stat-value" id="totalViagens">0</div>
                </div>
            </div>
            <button id="btnFecharMes" class="btn btn-danger admin-only" style="width:100%;">Encerrar Mês Atual</button>
        </section>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

        <section>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h2 style="font-size: 1.2rem;">Saldos</h2>
                <button id="btnNovaPessoa" class="btn btn-primary btn-sm admin-only">+ Pessoa</button>
            </div>
            <div class="table-responsive">
                <table class="table" id="tabelaPessoas">
                    <thead>
                        <tr>
                            <th>NOME</th>
                            <th class="text-right">DÍVIDA</th>
                            <th class="text-right">CRÉDITO</th>
                            <th class="text-right">SALDO</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

        <section>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h2 style="font-size: 1.2rem;">Viagens</h2>
                <button id="btnNovaViagem" class="btn btn-primary btn-sm">+ Viagem</button>
            </div>
            <div class="table-responsive">
                <table class="table" id="tabelaViagens">
                    <thead>
                        <tr>
                            <th>DATA</th>
                            <th>MOTORISTA</th>
                            <th class="text-right">TOTAL</th>
                            <th class="admin-only">AÇÕES</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="modalAdmin" class="modal hidden"><div class="modal-content"><div class="modal-header"><h3>⚙️ Configurações</h3><button class="modal-close">&times;</button></div><div class="modal-body"><div class="form-group"><label>Valor Padrão (R$)</label><input type="number" id="configValorPadrao" class="form-control" step="0.5"><button id="btnSalvarConfig" class="btn btn-primary" style="width:100%; margin-top:10px;">Salvar Valor</button></div><hr><h4 style="margin-top:10px;">Usuários</h4><div id="listaUsuariosAdmin"></div></div></div></div>
    
    <div id="modalViagem" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header"><h3>Nova Viagem</h3><button class="modal-close">&times;</button></div>
            <div class="modal-body">
                <input type="hidden" id="viagemId">
                <div class="form-group"><label>Data</label><input type="date" id="viagemData" class="form-control"></div>
                <div class="form-group"><label>Motorista</label><select id="viagemMotorista" class="form-control"></select></div>
                <div class="form-group">
                    <label>Valor Unitário</label>
                    <div class="moeda-input-group"><span>R$</span><input type="number" id="viagemValorUnit" disabled></div>
                </div>
                <div class="form-group"><label>Passageiros</label><div id="listaPassageiros" class="checkbox-list"></div></div>
            </div>
            <div class="modal-footer"><button id="btnSalvarViagem" class="btn btn-primary" style="width:100%">Salvar</button></div>
        </div>
    </div>

    <div id="modalPessoa" class="modal hidden"><div class="modal-content"><div class="modal-header"><h3>Nova Pessoa</h3><button class="modal-close">&times;</button></div><div class="modal-body"><div class="form-group"><label>Nome</label><input type="text" id="pessoaNome" class="form-control"></div></div><div class="modal-footer"><button id="btnSalvarPessoa" class="btn btn-primary" style="width:100%">Salvar</button></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/db-config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
