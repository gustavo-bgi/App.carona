<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Caronas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
    </div>

    <header class="header">
        <div class="container">
            <h1>🚗 Controle de Caronas</h1>
            <div class="header-actions">
                <select id="mesSelecionado" class="month-selector">
                    </select>
            </div>
        </div>
    </header>

    <main class="container">
        
        <section class="dashboard">
            <h2>Dashboard - <span id="mesAtual">---</span></h2>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-content">
                        <div class="stat-label">Total de Viagens</div>
                        <div class="stat-value" id="totalViagens">0</div>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon">🛣️</div>
                    <div class="stat-content">
                        <div class="stat-label">Km Total</div>
                        <div class="stat-value" id="kmTotal">0 km</div>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon">💰</div>
                    <div class="stat-content">
                        <div class="stat-label">Custo Total</div>
                        <div class="stat-value" id="custoTotal">R$ 0,00</div>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon">🏷️</div>
                    <div class="stat-content">
                        <div class="stat-label">Custo Médio/Km</div>
                        <div class="stat-value" id="custoMedio">R$ 0,00</div>
                    </div>
                </div>
            </div>
        </section>

        <hr class="divider">

        <section class="section-pessoas">
            <div class="section-header">
                <h2>Pessoas / Saldos</h2>
                <button id="btnNovaPessoa" class="btn btn-primary btn-sm">+ Nova Pessoa</button>
            </div>
            
            <div class="table-responsive">
                <table class="table" id="tabelaPessoas">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Status</th>
                            <th>Saldo Devedor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
        </section>

        <hr class="divider">

        <section class="section-viagens">
            <div class="section-header">
                <h2>Histórico de Viagens</h2>
                <div class="actions">
                    <button id="btnNovaViagem" class="btn btn-primary btn-sm">+ Nova Viagem</button>
                </div>
            </div>
            
            <div class="table-responsive">
                <table class="table" id="tabelaViagens">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Obs</th>
                            <th>Motorista</th>
                            <th>Passageiros</th>
                            <th>Valor Total</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="modalPessoa" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Gerenciar Pessoa</h3>
                <button class="modal-close" data-modal="modalPessoa">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="pessoaId">
                <div class="form-group">
                    <label for="pessoaNome">Nome</label>
                    <input type="text" id="pessoaNome" class="form-control" required placeholder="Nome da pessoa">
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="pessoaAtivo" checked>
                    <label for="pessoaAtivo">Ativo (aparece nas novas viagens)</label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-modal="modalPessoa">Cancelar</button>
                <button id="btnSalvarPessoa" class="btn btn-primary">Salvar</button>
            </div>
        </div>
    </div>

    <div id="modalViagem" class="modal hidden">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3>Gerenciar Viagem</h3>
                <button class="modal-close" data-modal="modalViagem">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="viagemId">
                
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label for="viagemData">Data</label>
                            <input type="date" id="viagemData" class="form-control" required>
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group">
                            <label for="viagemMotorista">Motorista</label>
                            <select id="viagemMotorista" class="form-control" required>
                                </select>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label for="viagemKm">Quilometragem (Km)</label>
                            <input type="number" id="viagemKm" class="form-control" step="0.1" min="0">
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group">
                            <label for="viagemValorTotal">Valor Total (R$)</label>
                            <input type="number" id="viagemValorTotal" class="form-control" step="0.01" min="0" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Passageiros (Quem vai dividir a conta?)</label>
                    <div id="listaPassageirosCheckboxes" class="checkbox-list">
                        </div>
                </div>

                <div class="form-group">
                    <label for="viagemObservacao">Observação</label>
                    <textarea id="viagemObservacao" class="form-control" rows="2"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-modal="modalViagem">Cancelar</button>
                <button id="btnSalvarViagem" class="btn btn-primary">Salvar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/utils.js"></script>
    <script src="js/db-config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
