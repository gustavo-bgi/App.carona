<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caronas</title>
    <link rel="stylesheet" href="css/style.css?v=50">
    <style>
        .admin-only { display: none !important; }
        body.modo-admin-ativo .admin-only { display: inline-flex !important; }
        .btn-lock { background: none; border: none; font-size: 1.4rem; cursor: pointer; opacity: 0.3; }
        body.modo-admin-ativo .btn-lock { opacity: 1; }
        .header .container { display: flex; justify-content: space-between; align-items: center; }
        
        /* Ajuste do campo de valor desalinhado */
        .input-moeda-container {
            display: flex;
            align-items: center;
            background: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 0 12px;
            height: 45px;
        }
        .input-moeda-container span {
            color: #666;
            font-weight: bold;
            margin-right: 8px;
            font-size: 1rem;
        }
        .input-moeda-container input {
            border: none !important;
            background: transparent !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin: 0 !important;
            font-size: 1.1rem;
            width: 100%;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay hidden"><div class="spinner"></div></div>
    <header class="header">
        <div class="container">
            <div style="display:flex; align-items:center; gap:8px;"><h1>🚗 Caronas</h1><button id="btnToggleAdmin" class="btn-lock">🔒</button></div>
            <div style="display:flex; gap:8px; align-items:center;">
                <select id="mesSelecionado" class="month-selector"></select>
                <button id="btnAdminPanel" class="btn btn-danger btn-sm admin-only">⚙️</button>
            </div>
        </div>
    </header>
    <main class="container">
        <section class="dashboard">
            <div class="stat-card">
                <div class="stat-icon">🗓️</div>
                <div><div class="stat-label">Viagens em <span id="labelMes">...</span></div><div class="stat-value" id="totalViagens">0</div></div>
            </div>
            <button id="btnFecharMes" class="btn btn-danger admin-only" style="width:100%;">Encerrar Mês Atual</button>
        </section>
        <hr class="divider">
        <section>
            <div class="section-header"><h2>Saldos</h2><button id="btnNovaPessoa" class="btn btn-primary btn-sm admin-only">+ Pessoa</button></div>
            <div class="table-responsive"><table class="table"><thead><tr><th>Nome</th><th class="text-right">Dívida</th><th class="text-right">Crédito</th><th class="text-right">Saldo</th></tr></thead><tbody id="tabelaPessoas"></tbody></table></div>
        </section>
        <hr class="divider">
        <section>
            <div class="section-header"><h2>Viagens</h2><button id="btnNovaViagem" class="btn btn-primary btn-sm">+ Viagem</button></div>
            <div class="table-responsive"><table class="table"><thead><tr><th>Data</th><th>Motorista</th><th class="text-right">Total</th><th class="admin-only">Ações</th></tr></thead><tbody id="tabelaViagens"></tbody></table></div>
        </section>
    </main>

    <div id="modalAdmin" class="modal hidden"><div class="modal-content"><div class="modal-header"><h3>⚙️ Configurações</h3><button class="modal-close">&times;</button></div><div class="modal-body"><div class="form-group"><label>Valor Padrão (R$)</label><input type="number" id="configValorPadrao" class="form-control" step="0.5"><button id="btnSalvarConfig" class="btn btn-primary" style="width:100%; margin-top:10px;">Salvar Valor</button></div><hr class="divider"><h4>Usuários</h4><div id="listaUsuariosAdmin" style="max-height:180px; overflow-y:auto;"></div></div></div></div>
    
    <div id="modalViagem" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header"><h3>Nova Viagem</h3><button class="modal-close">&times;</button></div>
            <div class="modal-body">
                <input type="hidden" id="viagemId">
                <div class="form-group"><label>Data</label><input type="date" id="viagemData" class="form-control"></div>
                <div class="form-group"><label>Motorista</label><select id="viagemMotorista" class="form-control"></select></div>
                <div class="form-group">
                    <label>Valor Unitário (R$)</label>
                    <div class="input-moeda-container">
                        <span>R$</span>
                        <input type="number" id="viagemValorUnit" disabled>
                    </div>
                </div>
                <div class="form-group"><label>Passageiros</label><div id="listaPassageiros" class="checkbox-list" style="max-height:150px; overflow-y:auto; border:1px solid #ddd; padding:10px;"></div></div>
            </div>
            <div class="modal-footer"><button id="btnSalvarViagem" class="btn btn-primary" style="width:100%">Salvar</button></div>
        </div>
    </div>

    <div id="modalPessoa" class="modal hidden"><div class="modal-content"><div class="modal-header"><h3>Nova Pessoa</h3><button class="modal-close">&times;</button></div><div class="modal-body"><div class="form-group"><label>Nome</label><input type="text" id="pessoaNome" class="form-control"></div></div><div class="modal-footer"><button id="btnSalvarPessoa" class="btn btn-primary" style="width:100%">Salvar</button></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/db-config.js?v=50"></script>
    <script src="js/app.js?v=50"></script>
</body>
</html>
